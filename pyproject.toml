[project]
name = "makersim"
version = "0.1.0"
description = "A visual load-path playground for 3D-printed parts"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "numpy>=2.2,<3",
  "scipy>=1.15,<2",
  "mcp>=1.28,<2",
  "matplotlib>=3.10,<4",
]

[project.scripts]
makersim = "backend.cli:main"
makersim-mcp = "backend.mcp_server:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["backend"]

[tool.setuptools.package-data]
backend = ["data/*.json", "data/*.csv", "data/*.stl", "data/BASELINE_LICENSE", "data/calibration/*"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
