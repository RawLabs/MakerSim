name: MCP container

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - uv.lock
      - backend/**
      - scripts/mcp-introspection.py
      - .github/workflows/mcp-container.yml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - uv.lock
      - backend/**
      - scripts/mcp-introspection.py
      - .github/workflows/mcp-container.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  introspection:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.7'
          python-version: '3.12'
      - name: Install inspection client
        run: uv sync --locked --no-dev
      - name: Build stdio server image
        run: docker build --tag makersim-mcp .
      - name: Inspect default entrypoint without network access
        run: .venv/bin/python scripts/mcp-introspection.py -- docker run --rm -i --network none makersim-mcp
      - name: Inspect bundled STL without network access
        run: docker run --rm --network none --entrypoint /app/.venv/bin/makersim makersim-mcp inspect /app/backend/data/backpack-bracket.stl
